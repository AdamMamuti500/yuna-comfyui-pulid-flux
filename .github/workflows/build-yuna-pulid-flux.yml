name: Build Yuna PuLID Flux Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag"
        required: true
        default: "2026-06-05-pulid"
      push_latest:
        description: "Also push :latest"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/adammamuti500/yuna-comfyui-pulid-flux

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 240  # weights download takes time

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk
        shell: bash
        run: |
          set -euxo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost || true
          sudo apt-get clean
          docker system prune -af || true
          df -h

      - name: Set tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${{ inputs.tag }}"
            if [ "${{ inputs.push_latest }}" = "true" ]; then
              echo "${IMAGE_NAME}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./pulid-baked
          file: ./pulid-baked/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
          sbom: false
          no-cache: true

      - name: Disk report
        if: always()
        shell: bash
        run: |
          docker system df || true
          df -h
